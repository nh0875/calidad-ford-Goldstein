# ============================================================================
# nginx del servidor de la empresa (INDEN) — sitio "Calidad Ford"
# ============================================================================
# Objetivo (definido con el cliente): el WEBHOOK de Meta es lo único accesible
# desde internet; TODO el resto del sistema (login, tableros, chat, API) solo se
# abre desde la red interna de la oficina. Los datos de clientes (PII) no quedan
# expuestos a internet.
#
# El stack de la app corre en Podman y publica el frontend+API en 127.0.0.1:8080
# (ver HTTP_BIND / HTTP_PORT en el .env del servidor). Este nginx hace de reverse
# proxy con el certificado comodín *.apps.mariogoldsteinsa.com.ar ya emitido.
#
# >>> AJUSTAR: las líneas marcadas con  # <-- AJUSTAR  (subredes de la oficina y,
#     si hace falta, la ruta del certificado si no la resuelven globalmente).
# ============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calidad.apps.mariogoldsteinsa.com.ar;

    # Certificado comodín ya emitido (si no lo toman de una config global):
    # ssl_certificate     /etc/nginx/ssl/apps.mariogoldsteinsa.com.ar/fullchain.pem;   # <-- AJUSTAR
    # ssl_certificate_key /etc/nginx/ssl/apps.mariogoldsteinsa.com.ar/privkey.pem;      # <-- AJUSTAR

    # Meta manda notificaciones en ráfaga; que no lo corte un body chico.
    client_max_body_size 15m;

    # Cabeceras comunes al backend
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------
    # PÚBLICO: solo el webhook de Meta. Meta lo llama desde sus propias IPs
    # (cambian, por eso no se filtran por IP). La app valida el verify token
    # en el GET; el POST se procesa y responde 200. Ver nota de hardening en
    # el README (validar la firma X-Hub-Signature-256).
    # ------------------------------------------------------------------
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # ------------------------------------------------------------------
    # INTERNO: todo lo demás (login, tableros, chat de Seguimiento, resto de
    # la API) SOLO desde la red de la oficina. Desde afuera: 403.
    # ------------------------------------------------------------------
    location / {
        allow 10.0.0.0/8;        # <-- AJUSTAR a la(s) subred(es) reales de la oficina
        allow 192.168.0.0/16;    # <-- AJUSTAR / quitar si no aplica
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://127.0.0.1:8080;

        # (No usamos WebSockets, pero queda por las dudas)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP -> HTTPS (si no lo resuelven con una redirección global)
server {
    listen 80;
    listen [::]:80;
    server_name calidad.apps.mariogoldsteinsa.com.ar;
    return 301 https://$host$request_uri;
}
