services:
  postgres:
    image: postgres:16-alpine
    container_name: calidad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calidad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calidad}
      POSTGRES_DB: ${POSTGRES_DB:-calidad_ford}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calidad} -d ${POSTGRES_DB:-calidad_ford}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: calidad-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: calidad-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-calidad}:${POSTGRES_PASSWORD:-calidad}@postgres:5432/${POSTGRES_DB:-calidad_ford}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backup_status:/var/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: calidad-frontend
    restart: unless-stopped
    environment:
      # Hosts permitidos por el dev server de Vite (ver vite.config.ts). Para
      # exponer por ngrok. En producción se usa el stack prod (nginx estático).
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: calidad-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # Backup diario de Postgres + verificación semanal (y copia offsite S3 si se
  # configuran las BACKUP_S3_*). Sin S3, hace backup local con rotación.
  backup:
    build:
      context: ./backup
    container_name: calidad-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-calidad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calidad}
      POSTGRES_DB: ${POSTGRES_DB:-calidad_ford}
      TZ: ${BACKUP_TZ:-America/Argentina/Buenos_Aires}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      VERIFY_DOW: ${VERIFY_DOW:-7}
      VERIFY_HOUR: ${VERIFY_HOUR:-04}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      VERIFY_MIN_CASOS: ${VERIFY_MIN_CASOS:-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - backups:/backups
      - backup_status:/var/backup-status
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  backups: # dumps locales (rotación configurable)
  backup_status: # status.json compartido entre backup y backend
