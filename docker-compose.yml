# ============================================================================
# ÚNICO compose del proyecto (GitOps: GitHub -> Portainer).
# Corre en el SERVIDOR (Podman rootless + Portainer + Nginx Proxy Manager).
# Cumple las reglas de INDEN:
#   - Imágenes desde GHCR (NADA de build: en el host).
#   - Rutas de imagen 100% en minúsculas.
#   - Sin bind mounts: solo volúmenes nombrados.
#   - Puerto alto en el host para que NPM enrute (no se tocan 80/443 ni firewall).
#   - Credenciales por variables de entorno cargadas en Portainer.
#
# TAG elige la rama de las imágenes:  main = producción · dev = staging.
# Como Dev y Prod son VMs distintas, el mismo HTTP_PORT no colisiona.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?cargar en Portainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cargar en Portainer}
      POSTGRES_DB: ${POSTGRES_DB:-calidad_ford}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-calidad_ford}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/nh0875/calidad-ford-goldstein-backend:${TAG:-main}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # Guarda anti-confusión de entorno (el backend aborta si falta).
      ENTORNO_PROD: ${ENTORNO_PROD:?cargar ENTORNO_PROD=1 en Portainer}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-calidad_ford}?schema=public
      REDIS_URL: redis://redis:6379
      # --- Meta / WhatsApp (si se migra la base con la MISMA CONFIG_ENCRYPTION_KEY,
      #     el token se lee cifrado de la base y estas pueden ir vacías) ---
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_TEMPLATE_NAME: ${META_TEMPLATE_NAME:-contacto_posventa}
      META_TEMPLATE_LANG: ${META_TEMPLATE_LANG:-es}
      META_TEMPLATE_VENTA_NAME: ${META_TEMPLATE_VENTA_NAME:-contacto_venta}
      META_FIDELIZACION_TEMPLATE_NAME: ${META_FIDELIZACION_TEMPLATE_NAME:-fidelizacion_posventa}
      META_RESPUESTA_NO_RECIBIDA_NAME: ${META_RESPUESTA_NO_RECIBIDA_NAME:-respuesta_no_recibida}
      META_RESPUESTA_NO_RECIBIDA_LANG: ${META_RESPUESTA_NO_RECIBIDA_LANG:-es_AR}
      META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-https://graph.facebook.com/v20.0}
      WHATSAPP_ENVIO_DELAY_MS: ${WHATSAPP_ENVIO_DELAY_MS:-2500}
      DIAS_SIN_RESPUESTA_PARA_NC: ${DIAS_SIN_RESPUESTA_PARA_NC:-5}
      MAX_ENVIOS_DIARIOS: ${MAX_ENVIOS_DIARIOS:-200}
      HORA_INICIO_ENVIO: ${HORA_INICIO_ENVIO:-09:00}
      HORA_FIN_ENVIO: ${HORA_FIN_ENVIO:-19:00}
      DELAY_AGRADECIMIENTO_MS: ${DELAY_AGRADECIMIENTO_MS:-180000}
      DELAY_ANALISIS_MS: ${DELAY_ANALISIS_MS:-90000}
      # Cifra los secretos guardados en la base (credenciales de Meta).
      # DEBE ser la MISMA que la de la PC de Vanina, o el token migrado no se lee.
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?cargar en Portainer}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      ANALISIS_MODO_MOCK: ${ANALISIS_MODO_MOCK:-false}
      ANALISIS_MAX_POR_MINUTO: ${ANALISIS_MAX_POR_MINUTO:-8}
      MODO_DEMO: ${MODO_DEMO:-false}
      JWT_SECRET: ${JWT_SECRET:?cargar en Portainer}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_INICIAL: ${ADMIN_PASSWORD_INICIAL:-}
      # Dominio real (CORS). Ej: https://calidad.apps.mariogoldsteinsa.com.ar
      FRONTEND_URL: ${FRONTEND_URL:-}
      RATE_LIMIT_POR_MINUTO: ${RATE_LIMIT_POR_MINUTO:-100}
      RATE_LIMIT_WEBHOOK_POR_MINUTO: ${RATE_LIMIT_WEBHOOK_POR_MINUTO:-600}
      BACKUP_STATUS_FILE: /var/backup-status/status.json
    volumes:
      - backup_status:/var/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: ghcr.io/nh0875/calidad-ford-goldstein-web:${TAG:-main}
    restart: unless-stopped
    # Sin puerto publicado en el host: NPM lo alcanza por la red red-proxy.
    networks:
      - default
      - npm_network
    depends_on:
      - backend

  backup:
    image: ghcr.io/nh0875/calidad-ford-goldstein-backup:${TAG:-main}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-calidad_ford}
      TZ: ${BACKUP_TZ:-America/Argentina/Buenos_Aires}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      VERIFY_DOW: ${VERIFY_DOW:-7}
      VERIFY_HOUR: ${VERIFY_HOUR:-04}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      VERIFY_MIN_CASOS: ${VERIFY_MIN_CASOS:-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - backups:/backups
      - backup_status:/var/backup-status
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_prod:
  redisdata_prod:
  backups:
  backup_status:

networks:
  npm_network:
    name: red-proxy
    external: true