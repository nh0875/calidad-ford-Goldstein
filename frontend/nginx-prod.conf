# nginx de producción: sirve la SPA compilada y hace proxy de /api al backend.
# Resolver de DNS de contenedores. Default 127.0.0.11 (Docker) para que la config
# SIEMPRE sea válida y nginx arranque; el entrypoint 40-set-resolver.sh lo cambia
# por el real si el contenedor usa otro (Podman lo lee de /etc/resolv.conf).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m; # uploads de Excel

    # WEBHOOK DE LA SEGUNDA MARCA (Volkswagen).
    #
    # Meta entrega los mensajes entrantes a UNA URL pública, y con el plan
    # gratuito de ngrok hay UN SOLO túnel disponible. Así que las dos marcas
    # comparten la dirección pública y se distinguen por la RUTA:
    #
    #   .../api/webhooks/whatsapp      -> backend de ESTE contenedor (Ford)
    #   .../api/vw/webhooks/whatsapp   -> backend de Volkswagen
    #
    # El rewrite saca el "/vw" para que el backend reciba la ruta que espera; él
    # no se entera de nada. En el panel de Meta de VW se carga la URL con /vw.
    # Va ANTES de "location /api/" a propósito: nginx elige el prefijo más largo,
    # así que esta gana para el webhook de VW y /api/ sigue atendiendo el resto.
    #
    # Si el stack corre sin el perfil "vw", este bloque simplemente nunca se usa
    # (y si alguien lo llama, da 502 sin afectar al resto del sitio).
    location /api/vw/webhooks/ {
        # OJO CON EL ORDEN: el "set" va ANTES del "rewrite". Las dos directivas
        # son del mismo módulo (rewrite) y el "break" corta esa fase, así que un
        # "set" escrito debajo nunca se ejecuta y proxy_pass queda con la variable
        # vacía ("invalid URL prefix in ''" -> 500). Se lee más natural al revés,
        # pero no funciona.
        set $backend_vw_upstream http://backend-vw:3000;
        rewrite ^/api/vw/webhooks/(.*)$ /api/webhooks/$1 break;
        proxy_pass $backend_vw_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API -> Express. Se usa una VARIABLE para el upstream: así nginx ARRANCA
    # aunque el backend esté caído (resuelve "backend" en cada request con el
    # resolver de arriba, no al iniciar). Si el backend no está, /api da 502 pero
    # el frontend igual carga. El resolver correcto (Docker/Podman) lo pone el
    # entrypoint 40-set-resolver.sh.
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # importaciones grandes de Excel
    }

    # Los assets con hash pueden cachearse fuerte (el hash cambia con cada build)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html NUNCA se cachea: es el que apunta a los assets con hash. Si el
    # navegador lo guarda, sigue pidiendo el bundle viejo y no ve los cambios
    # (le pasó a la usuaria: el input seguía aceptando solo .xlsx). Con no-store
    # cada visita trae el index fresco y, con él, el bundle nuevo.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA estática: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
