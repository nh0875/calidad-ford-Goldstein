# El resolver interno de Docker con TTL corto: si un contenedor se recrea y
# cambia de IP, nginx la vuelve a resolver en vez de quedarse con la vieja
# (con upstream estático quedaba apuntando a una IP muerta → 502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m; # uploads de Excel

    # API -> Express (se preserva el prefijo /api)
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # importaciones grandes de Excel
    }

    # Frontend -> Vite dev server (con soporte de HMR por websocket)
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
